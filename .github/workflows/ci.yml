name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build   # 含 tsc --noEmit 类型检查
      - run: npm test

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip
      - run: pip install -r requirements.txt pytest
      - name: Run backend tests
        run: |
          set -o pipefail
          python -m pytest -q --junitxml=pytest-results.xml 2>&1 | tee pytest.log
      - name: 失败诊断（写入 Job Summary，公开可读）
        if: always()
        run: python tools/ci_annotate.py

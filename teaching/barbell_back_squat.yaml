      - >-
        「臀部是发动机、股四头肌是辅助」「先动髋，不要膝盖先动」为来源体系的
        教学口诀，属绝对化表述：髋膝协调与力矩分配随杠位、身体比例、关节活动度
        与训练目标而异（审查引用：限制膝前移改变髋/膝力矩分配的研究 Fry et al.

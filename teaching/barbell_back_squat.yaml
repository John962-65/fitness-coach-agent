      - >-
        「躯干保持直立」应理解为保持脊柱中立与整体稳定，而非要求躯干竖直：
        合理躯干前倾角随杠位（高/低杠）与个体比例变化。待专业复核措辞。
      - >-
        「髋部低于膝盖（全蹲）」作为默认深度表述的适用边界（目标、活动度、
        控制能力）待专业复核；「膝盖内扣→受伤风险」需区分失控性动态内移与
        个体正常差异。

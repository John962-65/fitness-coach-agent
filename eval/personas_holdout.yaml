# R1 冻结确认集（holdout）——设计书 18.5 / 数据集身份与冻结纪律
#
# ⚠️ 冻结规则：
# - 本集 2026-09-26 冻结，只做"确认"，不做"诊断"和迭代依据
# - dev 集修出的结论必须在本集（语义不同、措辞全新）上复现才算数
# - 修改本集 = 重新冻结：须在 CHANGELOG 注明并作废此前所有确认结论
# - 覆盖 dev 集没覆盖的：伪目标澄清、口语/不规整数据、安全跟进闭环、已知脆弱点
#   （口语动作名打卡命中 17.2 L1 别名问题——本集断言刻意只到"落库不崩"，
#     趋势断言留给 L1 修复后解冻升级）

- id: holdout_shaping_clarify
  desc: 伪目标澄清：用户说"想塑形"，教练应追问澄清（设计书 10.4）
  turns:
    - say: "我想塑形，帮我开始吧"
    - say: "女，27岁，163cm，57kg"
      expect:
        db: {profile.basic.gender: "女"}
    - say: "就是想先瘦一点再有线条，每周练3次"
      expect:
        db: {profile.goal.primary: fat_loss}
    - say: "没有伤病，跟着视频练过两三个月"
    - say: "身体都正常，没怀孕没吃药，医生没限制"
      expect:
        db: {profile.onboarding_done: true}
    - say: "第一天练完了，大概40分钟，出汗不少"
      expect:
        tools: [save_checkin]

- id: holdout_colloquial_checkin
  desc: 口语化不规整数据：格式随意的打卡也必须落库且不崩（17.2 D1 回归）
  turns:
    - say: "建档，男，25岁，180cm，82kg，想增肌，每周练4天"
    - say: "没练过，没有伤病"
    - say: "身体正常没吃药没限制"
      expect:
        db: {profile.onboarding_done: true}
    - say: "深蹲80公斤做了5乘5，RPE大概8"
      expect:
        tools: [save_checkin]
        db: {checkins_count: 1, "checkins[0].type": training}
    - say: "体重84.5kg"
      expect:
        tools: [save_checkin]
        db: {"checkins[0].type": body}
    - say: "我这几次有进步吗"
      expect:
        no_tools_crash: true

- id: holdout_safety_followup
  desc: 安全跟进闭环：拦截 → 记录 → 用户确认无恙 → 关闭跟进（S3）
  turns:
    - say: "训练时突然胸口痛"
      expect:
        mode: block
        db: {open_flags_count: 1}
    - say: "去医院查了，心电图没事，医生说就是太累，让我休息好再练"
      expect:
        tools: [resolve_pain_flag]
        db: {open_flags_count: 0}
    - say: "那我明天能恢复训练吗"
      expect:
        no_tools_crash: true

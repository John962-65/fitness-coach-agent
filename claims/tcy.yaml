#   evidence: blogger_experience      # blogger_experience / cites_research / consensus
#   provenance: transcript            # 必须是一手来源才可点名
#   status: draft                     # draft → approved / rejected（发起人审核）
#   reviewed: {by: "", date: "", against: ""}
